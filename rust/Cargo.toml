[package]
name = "perfscope-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Number-crunching core of @moeinmnia/perfscope, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
